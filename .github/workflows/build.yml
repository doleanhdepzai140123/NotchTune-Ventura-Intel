name: Build NotchTune (100% Swift / SPM)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package NotchTune
    runs-on: macos-14 # macOS 14 runner đã cài sẵn Swift 5.10 / Xcode 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          swift --version

      - name: Build with Swift Package Manager
        run: |
          # Build executable bằng Swift Compiler, ép target về macOS Ventura (13.0)
          swift build -c release --triple x86_64-apple-macosx13.0

      - name: Package .app Bundle
        run: |
          mkdir -p build/NotchTune.app/Contents/MacOS
          mkdir -p build/NotchTune.app/Contents/Resources
          
          # Copy binary đã compile từ SPM vào .app structure
          cp .build/x86_64-apple-macosx/release/NotchTune build/NotchTune.app/Contents/MacOS/
          
          # Tạo Info.plist để macOS nhận diện đây là một App Bundle chạy ngầm (LSUIElement = true)
          cat <<EOF > build/NotchTune.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>NotchTune</string>
              <key>CFBundleIdentifier</key>
              <string>com.notchtune.app</string>
              <key>CFBundleName</key>
              <string>NotchTune</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>LSMinimumSystemVersion</key>
              <string>13.0</string>
              <key>LSUIElement</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Create ZIP Archive
        run: |
          cd build
          zip -r NotchTune-macOS-Ventura.zip NotchTune.app

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NotchTune-macOS13-Ventura
          path: build/NotchTune-macOS-Ventura.zip
          retention-days: 14
