name: Build NotchBox (macOS Ventura - Intel x86_64)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package NotchBox (Intel)
    runs-on: macos-13 # Runner kiến trúc Intel chạy macOS Ventura

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer
          swift --version

      - name: Build Swift Package for Intel x86_64
        run: |
          # Ép target biên dịch cho kiến trúc Intel x86_64 trên macOS Ventura 13.0
          swift build -c release -Xswiftc -target -Xswiftc x86_64-apple-macosx13.0

      - name: Locate Executable & Package .app
        run: |
          # Tìm file binary 'NotchBox' tự động trong thư mục .build
          BIN_PATH=$(find .build -type f -name "NotchBox" | grep -i "release" | head -n 1)
          
          if [ -z "$BIN_PATH" ]; then
            echo "Error: Binary NotchBox not found!"
            find .build -type f
            exit 1
          fi
          
          echo "Found binary at: $BIN_PATH"

          # Tạo cấu trúc .app bundle
          mkdir -p build/NotchBox.app/Contents/MacOS
          mkdir -p build/NotchBox.app/Contents/Resources

          # Copy binary vào .app
          cp "$BIN_PATH" build/NotchBox.app/Contents/MacOS/NotchBox

          # Copy Info.plist từ thư mục Resources/ nếu có, hoặc tự tạo nếu thiếu
          if [ -f "Resources/Info.plist" ]; then
            cp Resources/Info.plist build/NotchBox.app/Contents/Info.plist
          else
            cat <<EOF > build/NotchBox.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>NotchBox</string>
              <key>CFBundleIdentifier</key>
              <string>com.tinfine.NotchBox</string>
              <key>CFBundleName</key>
              <string>NotchBox</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>LSMinimumSystemVersion</key>
              <string>13.0</string>
              <key>LSUIElement</key>
              <true/>
          </dict>
          </plist>
          EOF
          fi

      - name: Create ZIP Archive
        run: |
          cd build
          zip -r NotchBox-macOS-Ventura-Intel.zip NotchBox.app

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NotchBox-macOS13-Intel
          path: build/NotchBox-macOS-Ventura-Intel.zip
          retention-days: 14
